name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate Python sources
        run: python -m py_compile carpet_matcher.py carpet_gui.py

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --collect-all gooey
          --name CarpetPatternMatcher
          carpet_gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CarpetPatternMatcher-Windows
          path: dist/CarpetPatternMatcher.exe
          if-no-files-found: error
          retention-days: 30
